# capabilities.yaml
#
# What kinds of work exist at 120/Life, independent of who performs them.
# The routing engine reasons over capabilities, not departments.
#
# specialist_only: work requiring this capability generally cannot be handed to
#   a capable generalist coordinator. It gates the Paul leverage engine --
#   Paul may PROJECT-MANAGE specialist work, but must not be made its owner.

